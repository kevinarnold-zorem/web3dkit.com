:root{
  --ink:#ffffff;
  --muted:rgba(255,255,255,.58);
  --pill:rgba(6,8,11,.90);
  --page:#000105;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--page);
  color:var(--ink);
  font-family:Outfit,'Outfit Fallback',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
  text-rendering:optimizeLegibility;
}
#stage{position:fixed;inset:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
/* vignette + edge falloff painted over the canvas */
#veil{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 78% at 50% 46%, rgba(0,0,0,0) 34%, rgba(0,0,0,.30) 74%, rgba(0,0,0,.72) 100%),
    linear-gradient(to bottom, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 14%);
}

/* ------------------------------ nav ------------------------------ */
.nav{
  position:absolute;left:0;right:0;top:32px;
  display:flex;justify-content:center;align-items:center;gap:24px;
  z-index:5;
}
.brand{
  height:40px;display:flex;align-items:center;
  text-shadow:0 0 22px rgba(4,10,20,.85);
}
.brand b{font-weight:600;font-size:19px;letter-spacing:-.004em;line-height:1}

/* Glass shells: a quiet top-lit fill under a real blur, edged with a gradient
   hairline that is brightest along the top.  Same idea as the metal buttons'
   travelling rim, dialled well down so these read as chrome, not as CTAs. */
.menu{
  position:relative;
  height:40px;border-radius:999px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.014) 46%, rgba(255,255,255,0)),
    rgba(6,8,11,.74);
  box-shadow:0 10px 30px rgba(0,0,0,.34);
  backdrop-filter:blur(16px) saturate(1.15);
  -webkit-backdrop-filter:blur(16px) saturate(1.15);
  display:flex;align-items:center;
}
.edge::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(176deg,
    rgba(255,255,255,.26) 0%,
    rgba(170,214,255,.13) 40%,
    rgba(255,255,255,.055) 74%,
    rgba(255,255,255,.032) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none;
}
.menu{padding-left:23px;padding-right:4px;gap:37.5px}
.menu a{
  color:rgba(255,255,255,.74);text-decoration:none;font-size:14.4px;font-weight:400;
  line-height:1;letter-spacing:.002em;transition:color .22s ease;white-space:nowrap;
}
.menu a:hover{color:#fff}
.menu a.cta{
  height:33px;padding:0 14.5px;border-radius:999px;
  background:#F4F4F2;color:#08090C;font-size:14.4px;font-weight:500;line-height:1;
  display:flex;align-items:center;text-decoration:none;white-space:nowrap;
  transition:background .22s ease,transform .22s ease;
}
.menu .lm-nav{margin-left:46px}
.menu a.cta.lm-btn{background:none;color:#fff}
.menu a.cta.lm-btn:hover{background:none;transform:none}

/* --------------------- liquid metal CTA (ThreeUI) ---------------------
   The button is a dark plate; a WebGL2 canvas overspills it on every side so
   the bloom has room, and the label rides on top.  --pad has to clear the
   glow's full reach or it gets cut off against the canvas edge. */
.lm{
  position:relative;display:inline-flex;
  --u:calc(var(--h) / 516);
  --pad:calc(760 * var(--u));
  isolation:isolate;
}
.lm-plate{
  position:absolute;inset:0;border-radius:999px;background:#0b0c0e;
  box-shadow:
    0 calc(var(--h) * .10) calc(var(--h) * .22) rgba(0,0,0,.72),
    0 calc(var(--h) * .30) calc(var(--h) * .66) rgba(0,0,0,.62),
    0 calc(var(--h) * .62) calc(var(--h) * 1.30) rgba(0,0,0,.42);
  transition:box-shadow .38s cubic-bezier(.22,.61,.36,1),
             background .38s cubic-bezier(.22,.61,.36,1);
}
.lm.is-hot .lm-plate{
  background:#08090a;
  box-shadow:
    0 calc(var(--h) * .12) calc(var(--h) * .26) rgba(0,0,0,.80),
    0 calc(var(--h) * .40) calc(var(--h) * .86) rgba(0,0,0,.72),
    0 calc(var(--h) * .86) calc(var(--h) * 1.80) rgba(0,0,0,.55);
}
.lm.is-press .lm-plate{
  background:#070809;
  box-shadow:
    0 calc(var(--h) * .05) calc(var(--h) * .13) rgba(0,0,0,.82),
    0 calc(var(--h) * .16) calc(var(--h) * .40) rgba(0,0,0,.70),
    0 calc(var(--h) * .34) calc(var(--h) * .80) rgba(0,0,0,.50);
  transition-duration:.10s;
}
.lm-fx{
  position:absolute;
  left:calc(-1 * var(--pad));top:calc(-1 * var(--pad));
  width:calc(100% + 2 * var(--pad));height:calc(100% + 2 * var(--pad));
  display:block;pointer-events:none;
}
.lm-btn{
  position:relative;
  background:none;color:#fff;box-shadow:none;
  -webkit-tap-highlight-color:transparent;
}
.lm-btn:hover{background:none;box-shadow:none}
.lm-btn:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px}
/* no WebGL2: fall back to the flat pills the page used before */
.lm-off .lm-fx{display:none}
.lm-off .lm-btn{background:#F6F6F4;color:#08090C}
.lm-off .lm-plate{display:none}

/* ------------------------------ hero ------------------------------ */
.hero{
  position:absolute;left:0;right:0;top:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;z-index:4;padding:0 24px;pointer-events:none;
}
.hero>*{pointer-events:auto}
h1{
  font-size:48.8px;line-height:53px;font-weight:500;letter-spacing:.006em;
  text-shadow:0 0 26px rgba(6,14,26,.75), 0 1px 2px rgba(0,0,0,.5);
  margin-top:-3.5px;
}
h1 span{display:block}
.sub{
  margin-top:13.2px;font-size:15.9px;font-weight:400;line-height:1.45;
  color:var(--muted);letter-spacing:.004em;
  text-shadow:0 0 18px rgba(4,10,20,.8);
}
.actions{margin-top:26px;display:flex;align-items:center;gap:15.2px}
.btn{
  height:43px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  gap:8px;text-decoration:none;font-size:14.6px;font-weight:500;letter-spacing:.001em;
  white-space:nowrap;transition:transform .22s cubic-bezier(.22,1,.36,1),background .22s ease,box-shadow .22s ease;
}
.btn:hover{transform:translateY(-2px)}
.lm .btn:hover{transform:none}
.btn-solid{background:#F6F6F4;color:#08090C;padding:0 18.2px}
.lm .btn-solid{padding:0 18.2px;background:none;color:#fff;box-shadow:none}
.lm .btn-solid:hover{background:none;box-shadow:none}
.btn-ghost{
  position:relative;color:#fff;padding:0 15px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.02) 48%, rgba(255,255,255,0)),
    rgba(9,12,17,.42);
  box-shadow:0 8px 24px rgba(0,0,0,.30);
  backdrop-filter:blur(12px) saturate(1.15);
  -webkit-backdrop-filter:blur(12px) saturate(1.15);
  transition:transform .22s cubic-bezier(.22,1,.36,1),background .22s ease;
}
.btn-ghost::before{opacity:.92;transition:opacity .22s ease}
.btn-ghost:hover::before{opacity:1}
.btn-ghost:hover{
  background:
    linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04) 48%, rgba(255,255,255,.01)),
    rgba(12,16,22,.46);
}

<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
'use strict';
if(typeof THREE==='undefined'){document.getElementById('gl').style.background=
  'radial-gradient(60% 55% at 50% 44%, #0d2b46 0%, #04070d 62%, #000104 100%)';return;}

/* =====================================================================
   BETAWISE — particle bust hero
   One unit = half the width of the head.  +y up, +z is the direction the
   face points; the camera sits on -z, so we look at the back of the head.
   ===================================================================== */

var P = {
  headLat:      470,      // rings, measured out from the axis facing the camera
  headLon:      166,      // meridians; a constant count, so they fan out radially
  headPsiMax:   150*Math.PI/180,   // how far round the head the scan reaches
  torsoStep:    0.0105,   // arc-length spacing between torso rings
  torsoDens:    56,       // torso ring points per unit of circumference
  fieldCount:   235000,
  fieldClumps:  215,

  pointSize:    1.06,
  fieldSize:    1.20,
  fresnelPow:   2.85,
  backSide:     0.26,
  bodyGain:    21.00,
  fieldGain:    3.90,

  exposure:     1.30,
  bloomStrength:0.90,
  bloomRadius:  1.15,
  bloomThresh:  0.30,

  introTau:     0.37,    // the fly-out decays exponentially, measured off the reference
  camNear:      0.10
};

var COL_DEEP = new THREE.Color(0.130,0.400,1.000);   // dim body of the cloud
var COL_MID  = new THREE.Color(0.070,0.470,1.000);  // the signature blue
var COL_HOT  = new THREE.Color(0.060,0.740,1.000);  // rim / core highlights

/* --------------------------------------------------------------- utils */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function smoothstep(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);}
function catmull(t,p0,p1,p2,p3){
  var t2=t*t,t3=t2*t;
  return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);
}
function sampleTable(tab,u){                 // u in [0,1] across the table
  var n=tab.length-1, x=clamp(u,0,1)*n, i=Math.floor(x), f=x-i;
  var p0=tab[Math.max(i-1,0)],p1=tab[i],p2=tab[Math.min(i+1,n)],p3=tab[Math.min(i+2,n)];
  return catmull(f,p0,p1,p2,p3);
}
// deterministic hash rng
var _s=1;
function rnd(){_s=(_s*1664525+1013904223)&0x7fffffff;return _s/0x7fffffff;}
function grnd(){return (rnd()+rnd()+rnd()-1.5)*1.1547;}   // ~unit gaussian

/* --------------------------------------------------- head surface model */
// Side-profile radius measured off the reference, psi = 0 at the crown.
var HEAD_R = [1.160,1.172,1.186,1.186,1.174,1.150,1.120,1.084,1.048,1.012,
              0.982,0.968,0.958,0.964,0.984,1.008,1.053,1.106,1.175,1.262,
              1.368,1.493,1.637,1.754,1.820];
var HEAD_PSI_SPAN = Math.PI;
var HEAD_C = new THREE.Vector3(0,0.10,0.0);

// radius of the head surface along a unit direction out of HEAD_C
function headSurface(dx,dy,dz,out){
  var psi = Math.acos(clamp(dy,-1,1));
  var r = sampleTable(HEAD_R, psi/HEAD_PSI_SPAN);
  var ch = dz, deg = psi*180/Math.PI;

  // the skull is deeper than it is wide; the jaw is shallower than the skull
  var dBack = 1.238 - 0.30*smoothstep(104,164,deg);
  var dFront= 1.248 - 0.52*smoothstep(94,150,deg) + 0.040*smoothstep(40,86,deg);
  var dr = ch>0 ? dFront : dBack;
  var m = 1.0/Math.sqrt(dx*dx + dy*dy + (dz/dr)*(dz/dr));

  // temples pinch in a touch above the ears
  m *= 1.0 - 0.042*Math.exp(-Math.pow((deg-60)/24,2))*Math.abs(dz);

  // ear: flat lobe on each side, just behind the widest point
  var eDot = clamp(Math.abs(dx)*0.9600 + dy*(-0.1500) + dz*(-0.2350), -1, 1);
  var eAng = Math.acos(eDot);
  var ear = 0.058*Math.exp(-Math.pow(eAng/0.255,2.1));

  // nose + brow, only ever seen through the cloud
  var nDot = clamp(dz*0.966 + dy*(-0.259), -1, 1);
  var nose = 0.072*Math.exp(-Math.pow(Math.acos(nDot)/0.140,2))*smoothstep(88,104,deg);
  var cDot = clamp(dz*0.438 + dy*(-0.899), -1, 1);
  var chin = 0.055*Math.exp(-Math.pow(Math.acos(cDot)/0.300,2))*smoothstep(132,158,deg);

  r = r*m + ear + nose + chin;

  // the mass below the cheekbones sits forward of the skull centre
  var zc = 0.075*smoothstep(84,152,deg);

  out.set(r*dx, HEAD_C.y + r*dy, HEAD_C.z + r*dz + zc);
  return out;
}
// scan axis points at the camera: rings crowd at the silhouette, meridians
// fan out from the middle of the head — the structure the reference shows.
function headScan(a,b,out){
  var sa=Math.sin(a), ca=Math.cos(a), sb=Math.sin(b), cb=Math.cos(b);
  return headSurface(sa*cb, sa*sb, -ca, out);
}

/* ---- how much light each height of the bust catches (traced off the reference) ---- */
var GAIN_HEAD_Y0=1.35, GAIN_HEAD_Y1=-2.35;
var GAIN_HEAD=[0.58,0.30,0.36,1.06,1.08,0.95,0.92,0.90,0.46,0.16,0.06];
var GAIN_TORSO_Y0=-1.00, GAIN_TORSO_Y1=-3.20;
var GAIN_TORSO=[0.28,0.42,0.56,0.70,0.86,0.80,0.34,0.12];
function gainHead(y){return sampleTable(GAIN_HEAD,(GAIN_HEAD_Y0-y)/(GAIN_HEAD_Y0-GAIN_HEAD_Y1));}
function gainTorso(y){return sampleTable(GAIN_TORSO,(GAIN_TORSO_Y0-y)/(GAIN_TORSO_Y0-GAIN_TORSO_Y1));}

/* -------------------------------------------------- torso surface model */
var TORSO_Y = [-1.00,-1.28,-1.52,-1.75,-1.95,-2.12,-2.28,-2.44,-2.58,-2.72,-2.92,-3.20];
var TORSO_R = [ 0.600, 0.570, 0.554, 0.546, 0.556, 0.602, 0.700, 0.900, 1.200, 1.700, 2.500, 3.600];
function torsoR(y){
  if(y>=TORSO_Y[0]) return TORSO_R[0];
  var n=TORSO_Y.length-1;
  if(y<=TORSO_Y[n]) return TORSO_R[n];
  for(var i=0;i<n;i++){
    if(y<=TORSO_Y[i] && y>=TORSO_Y[i+1]){
      var f=(TORSO_Y[i]-y)/(TORSO_Y[i]-TORSO_Y[i+1]);
      var p0=TORSO_R[Math.max(i-1,0)],p1=TORSO_R[i],p2=TORSO_R[i+1],p3=TORSO_R[Math.min(i+2,n)];
      return catmull(f,p0,p1,p2,p3);
    }
  }
  return TORSO_R[n];
}
function torsoSurface(y,th,out){
  var R=torsoR(y);
  var flat = 1.0 - 0.58*smoothstep(-2.20,-3.00,y);   // shoulders are shallow
  var ch=Math.cos(th), sh=Math.sin(th);
  var rz = R*flat*(ch>0 ? 1.02 : 0.94);
  out.set(R*sh, y, rz*ch + 0.03);
  return out;
}

/* --------------------------------------------- build the bust point set */
function buildBust(){
  var pos=[], nrm=[], seed=[], kind=[], gain=[];
  var a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3();
  var du=new THREE.Vector3(),dv=new THREE.Vector3(),nn=new THREE.Vector3();
  var i,j;

  /* ---- head: scanned about the view axis ---- */
  var eps=0.0022, hc=new THREE.Vector3();
  for(i=0;i<=P.headLat;i++){
    var al = P.headPsiMax*i/P.headLat;          // angle away from the camera axis
    var ring = Math.sin(al);
    var lon = P.headLon;
    var keep = clamp(0.22 + 2.4*ring, 0, 1);    // stop the axis point piling up
    for(j=0;j<lon;j++){
      if(keep<1 && rnd()>keep) continue;
      var be = (j + (i%2)*0.5)/lon*Math.PI*2;
      headScan(al,be,a);
      headScan(al+eps,be,b);
      headScan(al,be+eps,c);
      du.subVectors(b,a); dv.subVectors(c,a);
      nn.crossVectors(du,dv).normalize();
      hc.copy(a).sub(HEAD_C);
      if(nn.dot(hc)<0) nn.negate();
      var jt=0.0026;
      pos.push(a.x+nn.x*grnd()*jt, a.y+nn.y*grnd()*jt, a.z+nn.z*grnd()*jt);
      nrm.push(nn.x,nn.y,nn.z);
      seed.push(rnd());
      kind.push(0);
      // the jaw underside sits inside the neck, where a solid bust would hide it
      var hid = (a.y < -1.18)
        ? clamp((torsoR(a.y)*0.92 - Math.hypot(a.x, a.z-0.03))/0.16, 0, 1) : 0;
      gain.push(gainHead(a.y)*(1.0 - 0.88*hid));
    }
  }

  /* ---- torso: arc-length cylindrical scan ---- */
  var y=-1.12, prevY=y, prevR=torsoR(y), acc=0;
  var yEnd=-3.05;
  while(y>yEnd){
    y -= 0.0016;
    var R=torsoR(y);
    acc += Math.sqrt((prevY-y)*(prevY-y)+(prevR-R)*(prevR-R));
    prevY=y; prevR=R;
    if(acc<P.torsoStep) continue;
    acc=0;
    var lon=Math.max(24, Math.round(P.torsoDens*2*Math.PI*R));
    var off=rnd();
    for(j=0;j<lon;j++){
      var th=(j+off)/lon*Math.PI*2;
      torsoSurface(y,th,a);
      torsoSurface(y-eps,th,b);
      torsoSurface(y,th+eps,c);
      du.subVectors(b,a); dv.subVectors(c,a);
      nn.crossVectors(du,dv).normalize();
      if(nn.x*a.x + nn.z*(a.z-0.03) < 0) nn.negate();
      var jt2=0.0034;
      pos.push(a.x+nn.x*grnd()*jt2, a.y+nn.y*grnd()*jt2, a.z+nn.z*grnd()*jt2);
      nrm.push(nn.x,nn.y,nn.z);
      seed.push(rnd());
      kind.push(1);
      gain.push(gainTorso(a.y)*smoothstep(-1.16,-1.46,a.y));
    }
  }

  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('aNrm',    new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('aSeed',   new THREE.Float32BufferAttribute(seed,1));
  g.setAttribute('aKind',   new THREE.Float32BufferAttribute(kind,1));
  g.setAttribute('aGain',   new THREE.Float32BufferAttribute(gain,1));
  g.boundingSphere=new THREE.Sphere(new THREE.Vector3(0,-0.9,0),5.5);
  return g;
}

/* ------------------------------------------------ ambient dust field */
function buildField(){
  var n=P.fieldCount;
  var pos=new Float32Array(n*3), seed=new Float32Array(n), sz=new Float32Array(n), veil=new Float32Array(n);
  var cx=[],cy=[],cz=[],cr=[],cl=[];  // clump centres + brightness level
  for(var k=0;k<P.fieldClumps;k++){
    var rr=1.15+Math.pow(rnd(),1.05)*6.1;
    var aa=rnd()*Math.PI*2, hh=(rnd()-0.5)*7.4;
    cx.push(Math.cos(aa)*rr); cy.push(hh-0.4); cz.push(Math.sin(aa)*rr*0.9+(rnd()-0.5)*2.0);
    cr.push(0.30+Math.pow(rnd(),1.3)*1.45); cl.push(Math.pow(rnd(),1.7));
  }
  // the two bright masses that sit either side of the neck
  var POOL=cx.length;
  for(var m2=0;m2<40;m2++){
    var sgn=(m2%2)?1:-1;
    cx.push(sgn*(1.10+grnd()*0.21)); cy.push(-2.26+grnd()*0.22); cz.push(grnd()*0.76);
    cr.push(0.17+rnd()*0.15); cl.push(0.86+rnd()*0.14);
  }
  for(var i=0;i<n;i++){
    var x,y,z,lvl=0.5;
    var pool=false;
    if(rnd()<0.88){
      var k2, u0=rnd();
      if(u0<0.19){ k2=POOL+((rnd()*(cx.length-POOL))|0); pool=true; }
      else k2=(rnd()*POOL)|0;
      if(k2>=cx.length)k2=cx.length-1;
      var s=cr[k2]; lvl=cl[k2];
      x=cx[k2]+grnd()*s; y=cy[k2]+grnd()*s*0.78; z=cz[k2]+grnd()*s;
    }else{
      var ra=1.05+Math.pow(rnd(),0.95)*7.2, an=rnd()*Math.PI*2;
      x=Math.cos(an)*ra; y=(rnd()-0.5)*8.6; z=Math.sin(an)*ra;
    }
    // keep the volume out of the bust itself
    var d=Math.sqrt(x*x+(y-0.1)*(y-0.1)*0.55+z*z);
    if(d<1.45){var f=1.45/Math.max(d,0.01);x*=f;y=0.1+(y-0.1)*f;z*=f;}
    pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;
    seed[i]=clamp(lvl*0.62+rnd()*0.46,0,1);
    sz[i]=(pool?0.95:0.38)+Math.pow(rnd(),4.0)*2.6;
    veil[i]=(!pool&&rnd()<0.10)?1:0;

  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('aSeed',new THREE.Float32BufferAttribute(seed,1));
  g.setAttribute('aSize',new THREE.Float32BufferAttribute(sz,1));
  g.setAttribute('aVeil',new THREE.Float32BufferAttribute(veil,1));
  g.boundingSphere=new THREE.Sphere(new THREE.Vector3(0,0,0),16);
  return g;
}

/* =========================== shaders =========================== */
var BUST_VS = [
'attribute vec3 aNrm; attribute float aSeed; attribute float aKind; attribute float aGain;',
'uniform float uSize,uDpr,uTime,uFres,uBack,uGain,uIntro,uBreath;',
'varying float vI; varying float vS; varying float vK;',
'void main(){',
'  vec3 p = position;',
'  float w = sin(p.y*2.1 + uTime*0.55 + aSeed*6.28)*0.5+0.5;',
'  p += aNrm * (uBreath*(0.35+0.65*w));',
'  vec4 mv = modelViewMatrix*vec4(p,1.0);',
'  vec3 N = normalize(normalMatrix*aNrm);',
'  vec3 V = normalize(-mv.xyz);',
'  float nv = dot(N,V);',
'  float f = 1.0 - abs(nv);',
'  float rim = pow(clamp(f,0.0,1.0), uFres);',
'  rim *= mix(uBack, 1.0, smoothstep(-0.16,0.16,nv));',




'  float lit = (0.055 + rim*uGain)*aGain;',
'  lit *= 0.62 + 0.76*aSeed;',
'  vI = lit*uIntro;',
'  vS = aSeed; vK = aKind;',
'  float sc = uSize*uDpr*(0.55+0.9*aSeed);',
'  gl_PointSize = clamp(sc*(7.6/max(-mv.z,0.15)), 0.55, 9.0);',
'  gl_Position = projectionMatrix*mv;',
'}'].join('\n');

var BUST_FS = [
'precision highp float;',
'uniform vec3 cDeep,cMid,cHot;',
'varying float vI; varying float vS; varying float vK;',
'void main(){',
'  vec2 q = gl_PointCoord-0.5;',
'  float d = dot(q,q)*4.0;',
'  float a = exp(-d*7.4);',
'  if(a<0.004) discard;',
'  float i = vI;',
'  vec3 col = mix(cDeep,cMid, clamp(i*3.4,0.0,1.0));',
'  col = mix(col,cHot, clamp(pow(i,1.55)*0.90,0.0,1.0));',
'  gl_FragColor = vec4(col*i*a*0.30, 1.0);',
'}'].join('\n');

var FIELD_VS = [
'attribute float aSeed; attribute float aSize; attribute float aVeil;',
'uniform float uSize,uDpr,uTime,uIntro,uDrift;',
'varying float vI; varying float vS; varying float vV;',
'void main(){',
'  vec3 p = position;',
'  float t = uTime*0.055;',
'  p.x += sin(p.y*0.42 + aSeed*6.28 + t)*0.085;',
'  p.y += sin(p.z*0.37 + aSeed*11.3 + t*1.21)*0.075;',
'  p.z += cos(p.x*0.40 + aSeed*8.11 + t*0.87)*0.085;',
'  p.xz = mat2(cos(uDrift),-sin(uDrift),sin(uDrift),cos(uDrift))*p.xz;',
'  vec4 mv = modelViewMatrix*vec4(p,1.0);',
'  float dist = max(-mv.z,0.12);',
'  float fade = smoothstep(0.35,1.6,dist)*(1.0-smoothstep(9.0,17.0,dist));',
'  float tw = 0.62+0.38*sin(uTime*(0.7+aSeed*2.3)+aSeed*30.0);',
'  vI = fade*tw*uIntro*(0.10+pow(aSeed,2.2)*1.55);',
'  vS = aSeed; vV = aVeil;',
'  vI *= mix(1.0,0.16,aVeil);',
'  gl_PointSize = clamp(uSize*uDpr*aSize*mix(1.0,2.6,aVeil)*(6.4/dist), 0.5, 16.0);',
'  gl_Position = projectionMatrix*mv;',
'}'].join('\n');

var FIELD_FS = [
'precision highp float;',
'uniform vec3 cMid,cHot; uniform float uGain;',
'varying float vI; varying float vS; varying float vV;',
'void main(){',
'  vec2 q = gl_PointCoord-0.5;',
'  float a = exp(-dot(q,q)*4.0*mix(5.2,1.7,vV));',
'  if(a<0.004) discard;',
'  vec3 col = mix(cMid,cHot, clamp((vS-0.72)*3.2,0.0,1.0));',
'  gl_FragColor = vec4(col*vI*uGain*a*0.26, 1.0);',
'}'].join('\n');

var QUAD_VS = 'varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.0,1.0);}';

var RADIAL_FS = [
'precision highp float;',
'uniform sampler2D tSrc; uniform vec2 uRes; uniform float uAmt,uTime,uKeep;',
'varying vec2 vUv;',
'void main(){',
'  vec2 c = vec2(0.5,0.472);',
'  vec2 dir = vUv - c;',
'  float r = length(dir);',
'  if(uAmt<0.0008){ gl_FragColor = texture2D(tSrc,vUv); return; }',
'  float n = fract(sin(dot(vUv*uRes,vec2(12.9898,78.233))+uTime)*43758.5453);',
'  vec4 sum = vec4(0.0); float wsum=0.0;',
'  for(int i=0;i<14;i++){',
'    float f = (float(i)+n)/14.0;',
'    float w = 1.0-f*0.72;',
'    vec2 uv = c + dir*(1.0 - uAmt*f*(0.35+r*1.35));',
'    sum += texture2D(tSrc,uv)*w; wsum+=w;',
'  }',
'  gl_FragColor = mix(sum/wsum, texture2D(tSrc,vUv), uKeep);',
'}'].join('\n');

var BRIGHT_FS = [
'precision highp float;',
'uniform sampler2D tSrc; uniform float uThresh,uSoft;',
'varying vec2 vUv;',
'void main(){',
'  vec3 c = texture2D(tSrc,vUv).rgb;',
'  float l = max(c.r,max(c.g,c.b));',
'  float k = max(l-uThresh,0.0);',
'  k = k*k/(k+uSoft+1e-4);',
'  gl_FragColor = vec4(c*(k/max(l,1e-4)),1.0);',
'}'].join('\n');

var DOWN_FS = [
'precision highp float;',
'uniform sampler2D tSrc; uniform vec2 uTexel;',
'varying vec2 vUv;',
'void main(){',
'  vec4 s = texture2D(tSrc,vUv)*4.0;',
'  s += texture2D(tSrc,vUv+vec2(-1.0,-1.0)*uTexel);',
'  s += texture2D(tSrc,vUv+vec2( 1.0,-1.0)*uTexel);',
'  s += texture2D(tSrc,vUv+vec2(-1.0, 1.0)*uTexel);',
'  s += texture2D(tSrc,vUv+vec2( 1.0, 1.0)*uTexel);',
'  s += (texture2D(tSrc,vUv+vec2(-2.0,0.0)*uTexel)+texture2D(tSrc,vUv+vec2(2.0,0.0)*uTexel)',
'      + texture2D(tSrc,vUv+vec2(0.0,-2.0)*uTexel)+texture2D(tSrc,vUv+vec2(0.0,2.0)*uTexel))*0.5;',
'  gl_FragColor = s/10.0;',
'}'].join('\n');

var UP_FS = [
'precision highp float;',
'uniform sampler2D tSrc,tAdd; uniform vec2 uTexel; uniform float uRad;',
'varying vec2 vUv;',
'void main(){',
'  vec2 o = uTexel*uRad;',
'  vec4 s = texture2D(tSrc,vUv)*4.0;',
'  s += (texture2D(tSrc,vUv+vec2(-1.0,0.0)*o)+texture2D(tSrc,vUv+vec2(1.0,0.0)*o)',
'      + texture2D(tSrc,vUv+vec2(0.0,-1.0)*o)+texture2D(tSrc,vUv+vec2(0.0,1.0)*o))*2.0;',
'  s += texture2D(tSrc,vUv+vec2(-1.0,-1.0)*o)+texture2D(tSrc,vUv+vec2(1.0,-1.0)*o)',
'     + texture2D(tSrc,vUv+vec2(-1.0,1.0)*o)+texture2D(tSrc,vUv+vec2(1.0,1.0)*o);',
'  gl_FragColor = texture2D(tAdd,vUv) + s/16.0;',
'}'].join('\n');

var COMP_FS = [
'precision highp float;',
'uniform sampler2D tScene,tBloom; uniform float uExp,uBloom,uTime,uGrain,uVig;',
'uniform vec2 uRes;',
'varying vec2 vUv;',
'vec3 tonemap(vec3 c){',
'  float l = dot(c, vec3(0.2126,0.7152,0.0722));',
'  float m = l/(1.0+l*0.82);',
'  c *= m/max(l,1e-5);',
'  c = mix(c, vec3(m), clamp((m-0.80)*1.1,0.0,0.40));',
'  return clamp(c,0.0,1.0);',
'}',
'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
'void main(){',
'  vec3 s = texture2D(tScene,vUv).rgb;',
'  vec3 b = texture2D(tBloom,vUv).rgb;',
'  vec3 col = s + b*uBloom;',
'  col *= uExp;',
'  vec2 d = (vUv-vec2(0.5,0.472));',
'  float vig = 1.0 - uVig*dot(d,d)*1.62;',
'  col *= clamp(vig,0.0,1.0);',
'  col = tonemap(col);',
'  col = pow(col, vec3(1.0/2.2));',
'  float g = hash(vUv*uRes+uTime*61.7)-0.5;',
'  col += g*uGrain*(0.28+0.72*(1.0-dot(col,vec3(0.33))));',
'  gl_FragColor = vec4(max(col,0.0),1.0);',
'}'].join('\n');

/* =========================== renderer =========================== */
var canvas=document.getElementById('gl');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false,alpha:false,
  powerPreference:'high-performance',stencil:false,depth:false});
renderer.setClearColor(0x000000,1);
renderer.autoClear=false;

var sceneField=new THREE.Scene();
var sceneBust=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(30,1,0.05,80);

var bustMat=new THREE.ShaderMaterial({
  vertexShader:BUST_VS,fragmentShader:BUST_FS,
  uniforms:{uSize:{value:P.pointSize},uDpr:{value:1},uTime:{value:0},
    uFres:{value:P.fresnelPow},uBack:{value:P.backSide},uGain:{value:P.bodyGain},uIntro:{value:0},uBreath:{value:0},
    cDeep:{value:COL_DEEP},cMid:{value:COL_MID},cHot:{value:COL_HOT}},
  blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false,transparent:true
});
var fieldMat=new THREE.ShaderMaterial({
  vertexShader:FIELD_VS,fragmentShader:FIELD_FS,
  uniforms:{uSize:{value:P.fieldSize},uDpr:{value:1},uTime:{value:0},uIntro:{value:0},
    uDrift:{value:0},uGain:{value:P.fieldGain},cMid:{value:COL_MID},cHot:{value:COL_HOT}},
  blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false,transparent:true
});

var bust=new THREE.Points(buildBust(),bustMat);
var field=new THREE.Points(buildField(),fieldMat);
bust.frustumCulled=false; field.frustumCulled=false;
sceneField.add(field); sceneBust.add(bust);

/* ------------------------- post-processing rigs ------------------------ */
var LEV=6;
var RT=function(w,h){return new THREE.WebGLRenderTarget(Math.max(1,w|0),Math.max(1,h|0),{
  minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,
  type:THREE.HalfFloatType,depthBuffer:false,stencilBuffer:false});};

var rtScene=RT(2,2), rtBlur=RT(2,2), rtWarp=RT(2,2), down=[], up=[];
for(var L=0;L<LEV;L++){down.push(RT(2,2));up.push(RT(2,2));}

var quadScene=new THREE.Scene();
var quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
var quadGeo=new THREE.PlaneGeometry(2,2);
var quadMesh=new THREE.Mesh(quadGeo,null);
quadScene.add(quadMesh);
function pass(mat,target){
  quadMesh.material=mat;
  renderer.setRenderTarget(target||null);
  renderer.clear(true,false,false);
  renderer.render(quadScene,quadCam);
}
function mkMat(fs,uni){return new THREE.RawShaderMaterial({
  vertexShader:'precision highp float;attribute vec3 position;attribute vec2 uv;varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',
  fragmentShader:'precision highp float;'+fs,uniforms:uni,depthTest:false,depthWrite:false});}

var mRadial=mkMat(RADIAL_FS,{tSrc:{value:null},uRes:{value:new THREE.Vector2()},uAmt:{value:0},uTime:{value:0},uKeep:{value:0.34}});
var mBright=mkMat(BRIGHT_FS,{tSrc:{value:null},uThresh:{value:P.bloomThresh},uSoft:{value:0.28}});
var mDown  =mkMat(DOWN_FS,{tSrc:{value:null},uTexel:{value:new THREE.Vector2()}});
var mUp    =mkMat(UP_FS,{tSrc:{value:null},tAdd:{value:null},uTexel:{value:new THREE.Vector2()},uRad:{value:P.bloomRadius}});
var mComp  =mkMat(COMP_FS,{tScene:{value:null},tBloom:{value:null},uExp:{value:P.exposure},
  uBloom:{value:P.bloomStrength},uTime:{value:0},uGrain:{value:0.006},uVig:{value:0.62},
  uRes:{value:new THREE.Vector2()}});

/* ------------------------------ layout ------------------------------- */
// The reference frames a 4.557-unit tall window whose centre sits 0.39 units
// below the head centre; keep that on wide screens, ease off when narrow.
var FRAME_H=4.557, FRAME_CY=-0.339;
var W=1,H=1,DPR=1,frameH=FRAME_H;
function resize(){
  W=Math.max(1,canvas.clientWidth||window.innerWidth);
  H=Math.max(1,canvas.clientHeight||window.innerHeight);
  DPR=Math.min(window.devicePixelRatio||1, W*H>2600000?1.5:2.0);
  renderer.setPixelRatio(DPR);
  renderer.setSize(W,H,false);
  var pw=Math.round(W*DPR), ph=Math.round(H*DPR);
  rtScene.setSize(pw,ph); rtBlur.setSize(pw,ph); rtWarp.setSize(pw,ph);
  for(var i=0;i<LEV;i++){
    var s=Math.pow(2,i+1);
    down[i].setSize(Math.max(1,Math.round(pw/s)),Math.max(1,Math.round(ph/s)));
    up[i].setSize(Math.max(1,Math.round(pw/s)),Math.max(1,Math.round(ph/s)));
  }
  var aspect=W/H;
  camera.aspect=aspect;
  // hold the head's width when the viewport gets tall/narrow
  frameH = FRAME_H*Math.max(1, 1.52/Math.max(aspect,0.35));
  camera.fov=30;
  camera.updateProjectionMatrix();
  bustMat.uniforms.uDpr.value=DPR; fieldMat.uniforms.uDpr.value=DPR;
  mRadial.uniforms.uRes.value.set(pw,ph);
  mComp.uniforms.uRes.value.set(pw,ph);
}

function camDistance(){return (frameH*0.5)/Math.tan(camera.fov*0.5*Math.PI/180);}

/* ------------------------------ animation ---------------------------- */
var clock=new THREE.Clock();
var t0=performance.now();
var px=0,py=0,tx=0,ty=0;
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

window.addEventListener('pointermove',function(e){
  tx=(e.clientX/window.innerWidth-0.5);
  ty=(e.clientY/window.innerHeight-0.5);
},{passive:true});
window.addEventListener('pointerleave',function(){tx=0;ty=0;},{passive:true});


var lastD=null;

function frame(){
  requestAnimationFrame(frame);
  var dt=Math.min(clock.getDelta(),0.05);
  var t=(performance.now()-t0)/1000;

  var Df=camDistance();
  var D=Df*Math.max(P.camNear, 1-1.10*Math.exp(-t/P.introTau));

  var speed=(lastD===null)?0:Math.abs(D-lastD)/Math.max(dt,1e-4);
  lastD=D;

  px+=(tx-px)*Math.min(1,dt*3.2); py+=(ty-py)*Math.min(1,dt*3.2);
  var par=reduce?0:1;
  var yaw=px*0.085*par, pit=py*0.055*par;
  var breathe=reduce?0:Math.sin(t*0.45)*0.006;

  camera.position.set(Math.sin(yaw)*D, FRAME_CY+pit*1.05+Math.sin(t*0.31)*0.018, -Math.cos(yaw)*D);
  camera.lookAt(0, FRAME_CY+pit*0.30-0.02, 0);

  bustMat.uniforms.uTime.value=t;
  bustMat.uniforms.uIntro.value=smoothstep(0.07,0.52,t);
  bustMat.uniforms.uBreath.value=breathe;
  fieldMat.uniforms.uTime.value=t;
  fieldMat.uniforms.uIntro.value=smoothstep(0.0,0.24,t);
  fieldMat.uniforms.uDrift.value=(reduce?0:t*0.0105);

  /* --- dust first, so it alone can be smeared into rays --- */
  renderer.setRenderTarget(rtScene);
  renderer.clear(true,false,false);
  renderer.render(sceneField,camera);

  var rush=clamp(speed/Df*0.145,0,0.62);
  mRadial.uniforms.tSrc.value=rtScene.texture;
  mRadial.uniforms.uAmt.value=0.012+rush;
  mRadial.uniforms.uKeep.value=0.76;
  mRadial.uniforms.uTime.value=t;
  pass(mRadial,rtBlur);

  /* --- the bust lands on top of the rays, crisp --- */
  renderer.setRenderTarget(rtBlur);
  renderer.render(sceneBust,camera);

  /* --- during the fly-in everything smears --- */
  var src0=rtBlur;
  if(rush>0.004){
    mRadial.uniforms.tSrc.value=rtBlur.texture;
    mRadial.uniforms.uAmt.value=rush;
    mRadial.uniforms.uKeep.value=0.30;
    pass(mRadial,rtWarp);
    src0=rtWarp;
  }

  /* --- bloom --- */
  mBright.uniforms.tSrc.value=src0.texture;
  pass(mBright,down[0]);
  for(var i=1;i<LEV;i++){
    mDown.uniforms.tSrc.value=down[i-1].texture;
    mDown.uniforms.uTexel.value.set(1/down[i-1].width,1/down[i-1].height);
    pass(mDown,down[i]);
  }
  var src=down[LEV-1];
  for(var j=LEV-2;j>=0;j--){
    mUp.uniforms.tSrc.value=src.texture;
    mUp.uniforms.tAdd.value=down[j].texture;
    mUp.uniforms.uTexel.value.set(1/src.width,1/src.height);
    pass(mUp,up[j]);
    src=up[j];
  }

  /* --- composite --- */
  mComp.uniforms.tScene.value=src0.texture;
  mComp.uniforms.tBloom.value=src.texture;
  mComp.uniforms.uTime.value=t;
  pass(mComp,null);
}


window.addEventListener('resize',resize);
resize();
frame();
})();
</script>
<script>
/* =====================================================================
   Liquid metal CTA — adapted from the ThreeUI <LiquidMetalButton />
   "Sign up pill" variant (raw WebGL 2).  A scalar field is painted through
   a soft plateau once per wavelength, so every band edge opens into a prism;
   a travelling rim, a pointer well and press ripples disturb it.

   Adapted here: one shared render loop drives several instances, each sized
   off its own button, so the nav CTA and the hero CTA can differ in scale.
   ===================================================================== */
(function(){
'use strict';
var hosts = Array.prototype.slice.call(document.querySelectorAll('.lm'));
if(!hosts.length) return;

var VERT = '#version 300 es\nin vec2 position; void main(){ gl_Position = vec4(position,0.,1.); }';

var HEAD = [
'#version 300 es',
'precision highp float;',
'out vec4 o;',
'uniform vec2  uC;',
'uniform vec2  uHalf;',
'uniform float uT;',
'uniform float uHover;',
'uniform float uPress;',
'uniform vec4  uRip[3];',
'uniform vec4  uRipK;',
'uniform vec4  uRipK2;',
'uniform vec4  uPtr;',
'uniform vec4  uPtrK;',
'#define PI 3.14159265',
'float sdPill(vec2 p, vec2 b, float r){',
'  vec2 q = abs(p) - b + r;',
'  return min(max(q.x,q.y),0.) + length(max(q,0.)) - r;',
'}',
'float ripple(vec2 p, float t){',
'  float sum = 0.;',
'  for(int i = 0; i < 3; i++){',
'    if(uRip[i].w < 0.5) continue;',
'    float age = t - uRip[i].z;',
'    if(age < 0. || age > 4.) continue;',
'    vec2  rp = p - uRip[i].xy;',
'    float facet = 1. + uRipK2.x * cos(uRipK2.y * atan(rp.y, rp.x) + age * 2.1 + float(i) * 2.4);',
'    float x = (length(rp) - age * uRipK.x * facet) / uRipK.y;',
'    sum += exp(-pow(abs(x) + 1e-4, uRipK2.z)) * exp(-age * uRipK.z);',
'  }',
'  return sum;',
'}',
'float pointerW(vec2 p){',
'  if(uPtr.z < 0.001) return 0.;',
'  float d = length(p - uPtr.xy) / uPtrK.x;',
'  return exp(-d*d) * uPtr.z;',
'}',
'vec2 pointerWarp(vec2 p){',
'  float w = pointerW(p);',
'  if(w <= 0.) return vec2(0.);',
'  return normalize(p - uPtr.xy + vec2(1e-5)) * w * (uPtrK.y + uPtrK.z * uPtr.w);',
'}'
].join('\n');

var FRAG_RIM = HEAD + [
'',
'uniform float uBw;',
'uniform float uE[8];',
'float perim(vec2 d, float a, float r){',
'  float P = 4.*a + 2.*PI*r;',
'  float s;',
'  if(d.x >= a){',
'    float th = atan(d.y, d.x - a); if(th < 0.) th += 2.*PI;',
'    s = (th <= PI*0.5) ? r*th : P - r*(2.*PI - th);',
'  } else if(d.x <= -a){',
'    float th = atan(d.y, d.x + a); if(th < 0.) th += 2.*PI;',
'    s = r*PI*0.5 + 2.*a + r*(th - PI*0.5);',
'  } else if(d.y >= 0.){',
'    s = r*PI*0.5 + (a - d.x);',
'  } else {',
'    s = r*PI*1.5 + 2.*a + (d.x + a);',
'  }',
'  return s / P;',
'}',
'float pb(float u, float w){ u = fract(u); float x = min(u, 1.-u); return exp(-(x*x)/(w*w)); }',
'float rimHot(float s, float t){',
'  float v = uE[0];',
'  v += 0.62 * pb(s - t*uE[4],             0.075);',
'  v += 0.44 * pb(s + t*uE[4]*0.63 + 0.41, 0.135);',
'  v += 0.30 * pb(s - t*uE[4]*0.34 + 0.73, 0.200);',
'  return v;',
'}',
'float rimBand(float sd, float off){ return 1. - smoothstep(0., uBw*1.05, abs(sd + uBw*0.55 + off)); }',
'void main(){',
'  vec2  d  = gl_FragCoord.xy - uC;',
'  float sd = sdPill(d, uHalf, uHalf.y);',
'  if(sd > uBw*2.5 || sd < -uBw*3.5){ o = vec4(0.); return; }',
'  float a = max(uHalf.x - uHalf.y, 0.);',
'  float s = perim(d, a, uHalf.y);',
'  float top = mix(1., 0.5 + 0.5 * (d.y / uHalf.y), uE[5]);',
'  vec2  p   = vec2(d.x, -d.y) / (uHalf.y * 2.);',
'  float lift = 1. + uPress * uE[6] + ripple(p, uT) * uE[7] + pointerW(p) * uPtrK.w;',
'  o = vec4(vec3(',
'    rimBand(sd,  uE[2]) * rimHot(s + uE[3], uT),',
'    rimBand(sd,  0.   ) * rimHot(s,         uT),',
'    rimBand(sd, -uE[2]) * rimHot(s - uE[3], uT)',
'  ) * uE[1] * top * lift, 1.);',
'}'
].join('\n');

var FRAG_SCENE = HEAD + [
'',
'uniform float uP[21];',
'float h21(vec2 p){',
'  vec3 p3 = fract(vec3(p.xyx) * 0.1031);',
'  p3 += dot(p3, p3.yzx + 33.33);',
'  return fract((p3.x + p3.y) * p3.z);',
'}',
'float vn(vec2 p){',
'  vec2 i = floor(p), f = fract(p);',
'  f = f*f*(3.-2.*f);',
'  float a = h21(i), b = h21(i+vec2(1,0)), c = h21(i+vec2(0,1)), d = h21(i+vec2(1,1));',
'  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y) * 2. - 1.;',
'}',
'float fbm(vec2 p, float g){',
'  float s = 0., a = 1., n = 0.;',
'  for(int i=0;i<4;i++){ s += a*vn(p); n += a; p = p*2.03 + 11.7; a *= g; }',
'  return s / n;',
'}',
'float wig(float x, float t, float seed){',
'  return vn(vec2(x,          t*0.150 + seed)) * 0.60',
'       + vn(vec2(x*2.07 + 4., t*0.105 + seed)) * 0.27',
'       + vn(vec2(x*4.30 - 7., t*0.080 + seed)) * 0.13;',
'}',
'float valleyAt(vec2 p, float t){ return wig(p.x*uP[0], t, 0.0) * uP[1]; }',
'float densAt  (vec2 p, float t){ return uP[2] * exp(uP[3] * wig(p.x*uP[4] + 9.0, t, 2.7)); }',
'float surface(vec2 p, float t){',
'  float V = (p.y - valleyAt(p,t)) * densAt(p,t);',
'  V += uP[5] * fbm(p*vec2(0.8, 1.7)*uP[6] + vec2(t*0.05, -t*0.03), uP[17]);',
'  return V - uP[7];',
'}',
'float tone(float v){',
'  float u = fract(v);',
'  float e = uP[9], W = uP[10] * 0.5;',
'  return smoothstep(0.5-W-e, 0.5-W, u) * (1. - smoothstep(0.5+W, 0.5+W+e, u));',
'}',
'vec3 spec(float t){ return clamp(vec3(1.5) - abs(4.*t - vec3(3.,2.,1.)), 0., 1.); }',
'void main(){',
'  vec2  d  = gl_FragCoord.xy - uC;',
'  float sd = sdPill(d, uHalf, uHalf.y);',
'  float pill = 1. - smoothstep(-1., 1., sd);',
'  float S = uHalf.y * 2.;',
'  float t = uT;',
'  if(uHover <= 0.0015 || pill <= 0.0015){ o = vec4(0., 0., 0., pill); return; }',
'  vec2  p = vec2(d.x, -d.y) / S;',
'  vec2  q = p + pointerWarp(p);',
'  float h0 = surface(q, t);',
'  vec2  gp = vec2(dFdx(h0), -dFdy(h0)) * S;',
'  float V  = surface(q - gp * uP[8] / max(uP[2], .001), t);',
'  vec2  gd = normalize(gp + vec2(1e-5));',
'  V += uP[13] * fbm(vec2(dot(q,gd)*uP[14], dot(q, vec2(-gd.y,gd.x))*uP[14]*0.04) + vec2(0., t*0.06), 0.5);',
'  float rip  = ripple(p, t);',
'  float well = pointerW(p);',
'  V += rip * uRipK.w;',
'  const int N = 21;',
'  float mid = 1. - pow(0.5, uP[12]);',
'  vec3 col = vec3(0.), wsum = vec3(0.);',
'  for(int i=0;i<N;i++){',
'    float k = float(i)/float(N-1);',
'    vec3  w = spec(k);',
'    col  += w * tone(V + ((1. - pow(1. - k, uP[12])) - mid) * uP[11]);',
'    wsum += w;',
'  }',
'  col /= wsum;',
'  col = pow(col, vec3(uP[15]));',
'  float lit = smoothstep(uP[18], uP[19], q.y - valleyAt(q, t));',
'  lit *= mix(1., lit, 0.55);',
'  col *= uP[16] * lit;',
'  col = col * (1. + rip * 1.15 + well * 0.60);',
'  o = vec4(col * pill * uHover, pill);',
'}'
].join('\n');

var FRAG_DOWN = [
'#version 300 es',
'precision highp float;',
'out vec4 o;',
'uniform sampler2D uTex, uTex2;',
'uniform vec2 uDstTexel;',
'uniform float uAdd;',
'void main(){',
'  vec2 uv = gl_FragCoord.xy * uDstTexel;',
'  vec2 e = uDstTexel * 0.25;',
'  vec4 s = texture(uTex, uv + vec2(-e.x,-e.y)) + texture(uTex, uv + vec2( e.x,-e.y))',
'         + texture(uTex, uv + vec2(-e.x, e.y)) + texture(uTex, uv + vec2( e.x, e.y));',
'  s *= 0.25;',
'  if(uAdd > 0.5){',
'    vec4 r = texture(uTex2, uv + vec2(-e.x,-e.y)) + texture(uTex2, uv + vec2( e.x,-e.y))',
'           + texture(uTex2, uv + vec2(-e.x, e.y)) + texture(uTex2, uv + vec2( e.x, e.y));',
'    s.rgb += r.rgb * 0.25;',
'  }',
'  o = s;',
'}'
].join('\n');

var FRAG_BLUR = [
'#version 300 es',
'precision highp float;',
'out vec4 o;',
'uniform sampler2D uTex; uniform vec2 uTexel; uniform vec2 uDir; uniform float uR;',
'void main(){',
'  vec2 uv = gl_FragCoord.xy * uTexel;',
'  vec2 st = uTexel * uDir * uR;',
'  vec4 s = texture(uTex, uv) * 0.1964;',
'  s += (texture(uTex, uv + st*1.4118) + texture(uTex, uv - st*1.4118)) * 0.2969;',
'  s += (texture(uTex, uv + st*3.2941) + texture(uTex, uv - st*3.2941)) * 0.0944;',
'  s += (texture(uTex, uv + st*5.1765) + texture(uTex, uv - st*5.1765)) * 0.0104;',
'  o = s;',
'}'
].join('\n');

var FRAG_COMP = HEAD + [
'',
'uniform sampler2D uSoft, uRim, uGlow;',
'uniform vec2  uRes;',
'uniform float uGlowGain, uGlowIn, uOccl, uDim, uPunch;',
'void main(){',
'  vec2 uv = gl_FragCoord.xy / uRes;',
'  vec3 glow = texture(uGlow, uv).rgb;',
'  vec2  d    = gl_FragCoord.xy - uC;',
'  float sd   = sdPill(d, uHalf, uHalf.y);',
'  float pill = 1. - smoothstep(-1., 1., sd);',
'  vec4 m = texture(uSoft, uv);',
'  float veil = 1. - smoothstep(0.46, 0.88, abs(d.y) / uHalf.y);',
'  vec3 metal = pow(max(m.rgb / max(m.a, 1e-3), 0.), vec3(uPunch));',
'  vec3 core = metal * pill * mix(1., uDim, veil) + texture(uRim, uv).rgb;',
'  float rip = ripple(vec2(d.x, -d.y) / (uHalf.y * 2.), uT);',
'  core += vec3(rip * rip) * uRipK2.w * pill * mix(1., 0.42, veil);',
'  float sdSh = sdPill(d + vec2(0., uHalf.y * 0.62), uHalf * 0.94, uHalf.y * 0.94);',
'  float occl = uOccl * exp(-max(sdSh, 0.) / (uHalf.y * 0.75));',
'  vec3 rgb = core + glow * uGlowGain * mix(1., uGlowIn, pill) * (1. - occl * (1. - pill));',
'  float a = clamp(max(rgb.r, max(rgb.g, rgb.b)), 0., 1.);',
'  o = vec4(min(rgb, vec3(1.)), a);',
'}'
].join('\n');

/* the metal field — uP[0..20] (reference tuning) */
var P = { valFreq:0.50, valAmp:0.55, dens:2.40, densVar:2.20, densFreq:0.32,
          wobAmp:0.12, wobFreq:1.60, lift:0.05, refract:0.18, edge:0.04,
          width:0.46, disp:0.30, skew:1.50, fineAmp:0.0, fineFreq:9.0,
          gamma:1.00, gain:1.90, octGain:0.32, litLo:-0.26, litHi:0.10, dim:0.44 };
var E = { base:0.20, hot:0.82, chromA:0.42, chromS:0.030, speed:0.070,
          top:0.35, press:0.85, ripple:1.60 };
var C = { glow:1.95, glowR:1.30, glowIn:0.30, occl:0.62, soften:0.24, punch:1.50 };
var R = { speed:1.85, width:0.20, decay:1.35, amp:1.35, facet:0.18, lobes:6.0,
          sharp:1.15, emit:0.45, ptrRad:0.55, ptrAmp:0.32, ptrFast:0.40,
          ptrRim:0.80, ptrLag:0.0016, ptrVref:4.5 };
var PKEYS = Object.keys(P), EKEYS = Object.keys(E);
var uArr = new Float32Array(PKEYS.length), eArr = new Float32Array(EKEYS.length);
var calm = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : {matches:false};

function build(host){
  var cv  = host.querySelector('.lm-fx');
  var btn = host.querySelector('.lm-btn');
  if(!cv || !btn) return null;
  var gl = cv.getContext('webgl2', {alpha:true, antialias:false,
    premultipliedAlpha:true, powerPreference:'high-performance'});
  if(!gl){ host.classList.add('lm-off'); return null; }

  function sh(type, src){
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function prog(fs){
    var p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, VERT));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'position');
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    var u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for(var i=0;i<n;i++){ var info = gl.getActiveUniform(p,i);
      u[info.name.replace('[0]','')] = gl.getUniformLocation(p, info.name); }
    return {p:p, u:u};
  }
  var pScene, pRim, pDown, pBlur, pComp;
  try{
    pScene = prog(FRAG_SCENE); pRim = prog(FRAG_RIM);
    pDown  = prog(FRAG_DOWN);  pBlur = prog(FRAG_BLUR); pComp = prog(FRAG_COMP);
  }catch(err){ host.classList.add('lm-off'); return null; }

  var vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  var vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  var hasFloat = !!gl.getExtension('EXT_color_buffer_half_float');
  function makeTarget(){
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    var fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return {tex:tex, fbo:fbo, w:0, h:0};
  }
  function sizeTarget(t, w, h){
    if(t.w === w && t.h === h) return;
    t.w = w; t.h = h;
    gl.bindTexture(gl.TEXTURE_2D, t.tex);
    if(hasFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    else         gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8,   w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  }
  var T_core = makeTarget(), T_rim = makeTarget(),
      T_s1 = makeTarget(), T_s2 = makeTarget(),
      T_a = makeTarget(), T_b = makeTarget();

  var W=0, H=0, DPR=1, BW=0, BH=0, CX=0, CY=0, DOWN=4, GLOW_TEX=129, needResize=true;
  function resize(){
    var r  = cv.getBoundingClientRect();
    var br = btn.getBoundingClientRect();
    if(r.width < 2 || br.height < 2) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(2, Math.round(r.width  * DPR));
    var h = Math.max(2, Math.round(r.height * DPR));
    if(w !== W || h !== H){ W = w; H = h; cv.width = W; cv.height = H; }
    BW = br.width * DPR; BH = br.height * DPR;
    CX = (br.left - r.left) * DPR + BW/2;
    CY = H - ((br.top - r.top) * DPR + BH/2);
    sizeTarget(T_core, W, H); sizeTarget(T_rim, W, H);
    var hw = Math.max(2, Math.ceil(W/2)), hh = Math.max(2, Math.ceil(H/2));
    sizeTarget(T_s1, hw, hh); sizeTarget(T_s2, hw, hh);
    DOWN = Math.max(1, Math.min(4, Math.round(BH / GLOW_TEX)));
    var dw = Math.max(2, Math.ceil(W/DOWN)), dh = Math.max(2, Math.ceil(H/DOWN));
    sizeTarget(T_a, dw, dh); sizeTarget(T_b, dw, dh);
    needResize = false;
  }
  if(window.ResizeObserver) new ResizeObserver(function(){ needResize = true; }).observe(host);
  window.addEventListener('resize', function(){ needResize = true; });

  function drawTo(t){
    gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fbo : null);
    gl.viewport(0, 0, t ? t.w : W, t ? t.h : H);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  var hover=0, hoverTarget=0, press=0, pressTarget=0, clock=0;
  var RIP = [{x:0,y:0,t:-99,on:0},{x:0,y:0,t:-99,on:0},{x:0,y:0,t:-99,on:0}];
  var ripArr = new Float32Array(12), ripNext = 0;
  var ptr = {x:0,y:0}, ptrS = {x:0,y:0}, ptrAmt = 0, ptrSpeed = 0;
  var on = {over:false, press:false, focus:false};
  var drawn = null, idle = 0;

  function addRipple(x, y){
    var r = RIP[ripNext]; ripNext = (ripNext + 1) % RIP.length;
    r.x = x; r.y = y; r.t = clock; r.on = 1;
  }
  function localPt(e){
    var b = btn.getBoundingClientRect(), s = b.height;
    return [(e.clientX - (b.left + b.width/2)) / s,
            (e.clientY - (b.top  + b.height/2)) / s];
  }
  function sync(){
    hoverTarget = (on.over || on.press || on.focus) ? 1 : 0;
    pressTarget = on.press ? 1 : 0;
    host.classList.toggle('is-hot', hoverTarget > 0.5);
    host.classList.toggle('is-press', on.press);
  }

  btn.addEventListener('pointerenter', function(e){
    if(e.pointerType !== 'mouse') return;
    var l = localPt(e); ptr.x = l[0]; ptr.y = l[1];
    ptrS.x = ptr.x; ptrS.y = ptr.y; ptrSpeed = 0;
    on.over = true; sync();
  });
  btn.addEventListener('pointerleave', function(e){
    if(e.pointerType === 'mouse'){ on.over = false; sync(); }
  });
  window.addEventListener('pointermove', function(e){
    if(!on.over && !on.press) return;
    var l = localPt(e); ptr.x = l[0]; ptr.y = l[1];
  }, {passive:true});
  btn.addEventListener('pointerdown', function(e){
    var l = localPt(e); ptr.x = l[0]; ptr.y = l[1];
    on.press = true; sync(); addRipple(ptr.x, ptr.y);
  });
  window.addEventListener('pointerup',     function(){ on.press = false; sync(); });
  window.addEventListener('pointercancel', function(){ on.press = false; sync(); });
  btn.addEventListener('focus', function(){ on.focus = btn.matches(':focus-visible'); sync(); });
  btn.addEventListener('blur',  function(){ on.focus = false; sync(); });
  btn.addEventListener('keydown', function(e){
    if((e.key !== 'Enter' && e.key !== ' ') || e.repeat) return;
    on.press = true; sync(); addRipple(0, 0);
  });
  btn.addEventListener('keyup', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    on.press = false; sync();
  });

  resize();

  return function step(dt){
    if(!calm.matches) clock += dt;

    var k = hoverTarget > hover ? 1 - Math.pow(0.0012, dt) : 1 - Math.pow(0.00012, dt);
    hover += (hoverTarget - hover) * k;
    if(Math.abs(hoverTarget - hover) < 0.0008) hover = hoverTarget;

    var pk = pressTarget > press ? 1 - Math.pow(1e-9, dt) : 1 - Math.pow(0.004, dt);
    press += (pressTarget - press) * pk;
    if(Math.abs(pressTarget - press) < 0.002) press = pressTarget;

    var ripLive = false;
    for(var i = 0; i < RIP.length; i++){
      var r = RIP[i];
      if(r.on && clock - r.t > 4) r.on = 0;
      if(r.on) ripLive = true;
      ripArr[i*4] = r.x; ripArr[i*4+1] = r.y; ripArr[i*4+2] = r.t; ripArr[i*4+3] = r.on;
    }

    var lag = 1 - Math.pow(R.ptrLag, dt);
    var dx = (ptr.x - ptrS.x) * lag, dy = (ptr.y - ptrS.y) * lag;
    ptrS.x += dx; ptrS.y += dy;
    var inst = Math.min(Math.hypot(dx, dy) / Math.max(dt, 1e-3) / R.ptrVref, 1);
    ptrSpeed += (inst - ptrSpeed) * (1 - Math.pow(inst > ptrSpeed ? 0.001 : 0.02, dt));
    var wantWell = (on.over || on.press) ? 1 : 0;
    ptrAmt += (wantWell - ptrAmt) * (1 - Math.pow(0.004, dt));
    if(Math.abs(wantWell - ptrAmt) < 0.002) ptrAmt = wantWell;

    if(needResize) resize();
    if(!W || !H) return;

    var busy = hover > 0.002 || press > 0.002 || ripLive || ptrAmt > 0.002;
    idle += dt;
    if(!busy && idle < 0.033) return;
    idle = 0;

    var sig = (calm.matches && !ripLive && ptrAmt < 0.002)
      ? (hover + '|' + press + '|' + W + '|' + H) : null;
    if(sig !== null && sig === drawn) return;
    drawn = sig;

    for(var a = 0; a < uArr.length; a++) uArr[a] = P[PKEYS[a]];
    for(var b = 0; b < eArr.length; b++) eArr[b] = E[EKEYS[b]];
    var bw = Math.max(1.5, 3.2 * (BH/516));

    gl.bindVertexArray(vao);
    gl.useProgram(pScene.p);
    gl.uniform2f(pScene.u.uC, CX, CY);
    gl.uniform2f(pScene.u.uHalf, BW/2, BH/2);
    gl.uniform1f(pScene.u.uT, clock);
    gl.uniform1f(pScene.u.uHover, hover);
    gl.uniform1f(pScene.u.uPress, press);
    gl.uniform4fv(pScene.u.uRip, ripArr);
    gl.uniform4f(pScene.u.uRipK, R.speed, R.width, R.decay, R.amp);
    gl.uniform4f(pScene.u.uRipK2, R.facet, R.lobes, R.sharp, R.emit);
    gl.uniform4f(pScene.u.uPtr, ptrS.x, ptrS.y, ptrAmt, ptrSpeed);
    gl.uniform4f(pScene.u.uPtrK, R.ptrRad, R.ptrAmp, R.ptrFast, R.ptrRim);
    gl.uniform1fv(pScene.u.uP, uArr);
    drawTo(T_core);

    gl.useProgram(pRim.p);
    gl.uniform2f(pRim.u.uC, CX, CY);
    gl.uniform2f(pRim.u.uHalf, BW/2, BH/2);
    gl.uniform1f(pRim.u.uT, clock);
    gl.uniform1f(pRim.u.uBw, bw);
    gl.uniform1f(pRim.u.uPress, press);
    gl.uniform4fv(pRim.u.uRip, ripArr);
    gl.uniform4f(pRim.u.uRipK, R.speed, R.width, R.decay, R.amp);
    gl.uniform4f(pRim.u.uRipK2, R.facet, R.lobes, R.sharp, R.emit);
    gl.uniform4f(pRim.u.uPtr, ptrS.x, ptrS.y, ptrAmt, ptrSpeed);
    gl.uniform4f(pRim.u.uPtrK, R.ptrRad, R.ptrAmp, R.ptrFast, R.ptrRim);
    gl.uniform1fv(pRim.u.uE, eArr);
    drawTo(T_rim);

    gl.useProgram(pDown.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T_core.tex);
    gl.uniform1i(pDown.u.uTex, 0);
    gl.uniform1f(pDown.u.uAdd, 0);
    gl.uniform2f(pDown.u.uDstTexel, 1/T_s1.w, 1/T_s1.h);
    drawTo(T_s1);

    gl.useProgram(pBlur.p);
    gl.uniform1i(pBlur.u.uTex, 0);
    gl.uniform2f(pBlur.u.uTexel, 1/T_s1.w, 1/T_s1.h);
    var sigTex = C.soften * (BH * 0.5) * 0.95;
    if(sigTex > 0.1 && (hover > 0.002 || ripLive || ptrAmt > 0.002)){
      var iters = Math.min(4, Math.max(1, Math.ceil(sigTex / 3.0)));
      gl.uniform1f(pBlur.u.uR, sigTex / Math.sqrt(iters) / 1.95);
      for(var it = 0; it < iters; it++){
        gl.bindTexture(gl.TEXTURE_2D, T_s1.tex); gl.uniform2f(pBlur.u.uDir, 1, 0); drawTo(T_s2);
        gl.bindTexture(gl.TEXTURE_2D, T_s2.tex); gl.uniform2f(pBlur.u.uDir, 0, 1); drawTo(T_s1);
      }
    }

    gl.useProgram(pDown.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T_s1.tex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, T_rim.tex);
    gl.uniform1i(pDown.u.uTex, 0);
    gl.uniform1i(pDown.u.uTex2, 1);
    gl.uniform1f(pDown.u.uAdd, 1);
    gl.uniform2f(pDown.u.uDstTexel, 1/T_a.w, 1/T_a.h);
    drawTo(T_a);

    gl.useProgram(pBlur.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.uniform1i(pBlur.u.uTex, 0);
    gl.uniform2f(pBlur.u.uTexel, 1/T_a.w, 1/T_a.h);
    var rs = C.glowR * (BH / DOWN) / GLOW_TEX, RADII = [1.0, 2.3, 5.2, 9.0];
    for(var q = 0; q < RADII.length; q++){
      gl.uniform1f(pBlur.u.uR, RADII[q] * rs);
      gl.bindTexture(gl.TEXTURE_2D, T_a.tex); gl.uniform2f(pBlur.u.uDir, 1, 0); drawTo(T_b);
      gl.bindTexture(gl.TEXTURE_2D, T_b.tex); gl.uniform2f(pBlur.u.uDir, 0, 1); drawTo(T_a);
    }

    gl.useProgram(pComp.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T_s1.tex);  gl.uniform1i(pComp.u.uSoft, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, T_rim.tex); gl.uniform1i(pComp.u.uRim, 1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, T_a.tex);   gl.uniform1i(pComp.u.uGlow, 2);
    gl.uniform2f(pComp.u.uRes, W, H);
    gl.uniform2f(pComp.u.uC, CX, CY);
    gl.uniform2f(pComp.u.uHalf, BW/2, BH/2);
    gl.uniform1f(pComp.u.uT, clock);
    gl.uniform4fv(pComp.u.uRip, ripArr);
    gl.uniform4f(pComp.u.uRipK, R.speed, R.width, R.decay, R.amp);
    gl.uniform4f(pComp.u.uRipK2, R.facet, R.lobes, R.sharp, R.emit);
    gl.uniform1f(pComp.u.uGlowGain, C.glow);
    gl.uniform1f(pComp.u.uGlowIn, C.glowIn);
    gl.uniform1f(pComp.u.uOccl, C.occl);
    gl.uniform1f(pComp.u.uDim, P.dim);
    gl.uniform1f(pComp.u.uPunch, C.punch);
    drawTo(null);
  };
}

var steps = [];
for(var i = 0; i < hosts.length; i++){
  var s = build(hosts[i]);
  if(s) steps.push(s);
}
if(!steps.length) return;

var last = performance.now();
(function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min((now - last) / 1000, 1/20); last = now;
  for(var i = 0; i < steps.length; i++) steps[i](dt);
})(last);
})();
</script>
</body>
</html>
